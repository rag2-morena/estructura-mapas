name: Generar Mapas Estructura

on:
  schedule:
    - cron: '0 */2 * * *'   # cada 2 horas
  workflow_dispatch:          # permite ejecutar manualmente desde GitHub

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar mapas desde Knox API
        env:
          KNOX_BASE_URL:   ${{ secrets.KNOX_BASE_URL }}
          KNOX_CLIENT_ID:  ${{ secrets.KNOX_CLIENT_ID }}
          KNOX_SECRET:     ${{ secrets.KNOX_SECRET }}
        run: python scripts/generar_mapas.py

      - name: Publicar cambios en GitHub Pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
